# Builds FileNestSetup.exe on GitHub's Windows machines.
#
#  - Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`)
#    -> builds the installer and publishes a GitHub Release with it attached.
#  - "Run workflow" button on the Actions tab
#    -> builds the installer and attaches it to the run (no release).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = ""
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}" }
          ./packaging/build.ps1 -Version $version

      - name: Upload installer to this run
        uses: actions/upload-artifact@v4
        with:
          name: FileNestSetup
          path: build/installer/FileNestSetup.exe

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" build/installer/FileNestSetup.exe
          --title "FileNest ${{ github.ref_name }}"
          --generate-notes
